<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Popup</title>
        <link rel="stylesheet" href="style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
    </head>
    <body>
        <!-- Open button -->
        <button id="openBtn">Open Popup</button>
        
        <div class="overlay">
            <div class="popup">
                <i id="closeBtn" class="fa-solid fa-xmark"></i>
                <div class="left-side">
                    <img src="./image/left-side-image.jpg" alt="" />
                </div>
                <div class="right-side">
                    <h1>Escape to winter comfort with our cool giveaway.</h1>
                    <p>
                        Lorem, ipsum dolor sit amet consectetur adipisicing
                        elit. Quis quibusdam nihil quod nulla dolor quas?
                    </p>
                    <button>Take Me To Paradise</button>
                </div>
            </div>
        </div>
        <!-- javascript -->
        <script src="./script.js"></script>
    </body>
</html>
